
name: TP11 - Calidad y Documentacion

on:
  push:
    paths:
      - "IS2_TP11_Gestion_Calidad/**"
      - ".github/workflows/tp11-ci.yml"
  pull_request:
    paths:
      - "IS2_TP11_Gestion_Calidad/**"
      - ".github/workflows/tp11-ci.yml"

jobs:
  quality:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: IS2_TP11_Gestion_Calidad

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Ruff
        run: python -m ruff check .

      - name: Black
        run: python -m black --check . --line-length 100

      - name: MyPy
        run: python -m mypy src

      - name: Pyright
        run: pyright src

      - name: PEP257
        run: python -m pydocstyle src

      - name: Bandit
        run: python -m bandit -r src

      - name: Pytest y cobertura
        run: |
          python -m pytest tests/ -v \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=85

      - name: Generar documentacion
        run: python -m pdoc tp11_calidad -o docs/api

      - name: Publicar documentacion
        uses: actions/upload-artifact@v4
        with:
          name: tp11-documentacion-api
          path: IS2_TP11_Gestion_Calidad/docs/api/
